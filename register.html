<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Entre Linhas</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap">
    <link rel="stylesheet" href="frontend/css/style-reg.css">
</head>
<body>
<header class="header-faixa">Entre-Linhas</header>
<div class="cadastro-container">
    <div class="titulo">Cadastro</div>
    <form id="register-form">
        <div class="campo-grupo">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" required>
        </div>
        <div class="campo-grupo campo-faccionista">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" placeholder="000.000.000-00">
        </div>
        <div class="campo-grupo campo-faccionista">
            <label for="data-nascimento">Data de nascimento</label>
            <input type="date" id="data-nascimento">
        </div>
        <div class="campo-grupo campo-cnpj">
            <label for="cnpj">CNPJ (empresa/facção)</label>
            <input type="text" id="cnpj" placeholder="00.000.000/0000-00">
        </div>
        <div class="campo-grupo campo-ie">
            <label for="inscricao-estadual">Inscrição estadual (somente empresa)</label>
            <input type="text" id="inscricao-estadual">
        </div>
        <div class="campo-grupo">
            <label for="email">E-mail</label>
            <input type="email" id="email" required>
        </div>
        <div class="campo-grupo">
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" placeholder="(XX) XXXXX-XXXX" required>
        </div>
        <div class="campo-grupo">
            <label for="estado">Estado</label>
            <select id="estado" required>
                <option value="" disabled selected>Selecione o estado</option>
            </select>
        </div>
        <div class="campo-grupo">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" list="lista-cidades" required>
            <datalist id="lista-cidades"></datalist>
        </div>
        <div class="campo-grupo">
            <label for="servico-id">Serviço principal</label>
            <select id="servico-id">
                <option value="" selected>Selecione um serviço</option>
            </select>
        </div>
        <div class="campo-grupo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" required minlength="8">
        </div>
        <div class="campo-grupo">
            <label for="confirmacao-senha">Confirmação de senha</label>
            <input type="password" id="confirmacao-senha" required minlength="8">
        </div>
        <div id="feedback" class="descricao"></div>
        <div class="botoes-container">
            <a href="choose-reg.html" class="btn-voltar">Voltar</a>
            <button type="submit" class="btn-confirmar">Confirmar cadastro</button>
        </div>
    </form>
</div>
<footer class="footer-faixa">&copy; 2025 Entre-Linhas - Todos os direitos reservados.</footer>
<script src="frontend/js/main.js"></script>
<script src="frontend/js/auth.js"></script>
<script>
    const params = new URLSearchParams(window.location.search);
    const userType = params.get('type');
    const header = document.querySelector('.titulo');
    if (!userType) {
        window.location.href = 'choose-reg.html';
    } else if (header) {
        const labelMap = {
            FACCIONISTA: 'Cadastro - Faccionista',
            FACTION: 'Cadastro - Facção',
            COMPANY: 'Cadastro - Empresa'
        };
        header.textContent = labelMap[userType] || 'Cadastro';
    }

    function ajustarCamposPorTipo(tipo) {
        const campoFaccionista = document.querySelectorAll('.campo-faccionista');
        const campoCnpj = document.querySelectorAll('.campo-cnpj');
        const campoIe = document.querySelectorAll('.campo-ie');

        campoFaccionista.forEach(c => c.style.display = tipo === 'FACCIONISTA' ? 'block' : 'none');
        campoCnpj.forEach(c => c.style.display = tipo === 'FACTION' || tipo === 'COMPANY' ? 'block' : 'none');
        campoIe.forEach(c => c.style.display = tipo === 'COMPANY' ? 'block' : 'none');
    }

    ajustarCamposPorTipo(userType);
</script>
</body>
</html>

spring:
  application:
    name: entre-linhas
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:entrelinhas}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
  h2:
    console:
      enabled: false
  jpa:
    open-in-view: false

security:
  jwt:
    secret: ${JWT_SECRET:change-me-secret-change-me-secret-32}
    expiration: ${JWT_EXPIRATION_SECONDS:3600}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="frontend/css/style-reg.css">
</head>

<body>

    <header class="header-faixa">
        Entre-Linhas
    </header>

    <div class="cadastro-container">

        <div class="titulo">
            Cadastro
        </div>

        <form action="index.html" method="post">

            <div class="campo-grupo">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="campo-grupo">
                <label for="cnpj">CNPJ</label>
                <input type="text" id="cnpj" name="cnpj"
                       placeholder="00.000.000/0000-00"
                       pattern="\d{2}\.\d{3}\.\d{3}/\d{4}-\d{2}"
                       title="Digite o CNPJ no formato: 00.000.000/0000-00"
                       required>
            </div>

            <div class="campo-grupo">
                <label for="data-nascimento">Data de nascimento</label>
                <input type="date" id="data-nascimento" name="data-nascimento" required>
            </div>

            <div class="campo-grupo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="campo-grupo">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(XX) XXXXX-XXXX" required>
            </div>

            <div class="campo-grupo">
                <label for="estado">Estado</label>
                <select id="estado" name="estado" required>
                    <option value="" disabled selected>Selecione o estado</option>
                    <!-- opções carregadas pelo JS -->
                </select>
            </div>

            <div class="campo-grupo">
                <label for="cidade">Cidade</label>
                <input type="text" id="cidade" name="cidade" placeholder="Digite sua cidade" list="lista-cidades" required>
                <datalist id="lista-cidades"></datalist>
            </div>

            <div class="campo-grupo">
                <label for="serviço">Serviço</label>
                <div class="servico-container">
                    <select id="serviço" name="serviço">
                        <option value="" disabled selected>Selecione</option>
                        <option value="x">x</option>
                        <option value="y">y</option>
                        <option value="z">z</option>
                    </select>
                </div>
            </div>

            <div class="campo-grupo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required>
            </div>

            <div class="campo-grupo">
                <label for="confirmacao-senha">Confirmação de senha</label>
                <input type="password" id="confirmacao-senha" name="confirmacao-senha" required>
            </div>

            <div class="botoes-container">
                <a href="choose-reg.html" class="btn-voltar">Voltar</a>
                <button type="submit" class="btn-confirmar">
                    Confirmar cadastro
                </button>
            </div>

        </form>
    </div>

    <footer class="footer-faixa">
        &copy; 2025 Entre-Linhas - Todos os direitos reservados.
    </footer>

    <script src="frontend/js/main.js"></script>

</body>
</html>

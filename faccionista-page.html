<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entre-Linhas — Faccionista</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./frontend/css/faccionista.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<header>
    <div class="logo">
        <img src="frontend/images/agulha.png" alt="Agulha e Linha" class="logo-icon">
        Entre-Linhas
    </div>

    <div class="header-icons">
        <button class="icon-btn">👤</button>
    </div>
</header>

<main class="container">

    <h2>Facções</h2>

    <div class="panel">
        <div class="cards-grid">

            <div class="card">
                <div class="card-top">
                    <h3>Fação Estrela</h3>
                    <button class="btn-chat-card" data-faccao="Fação Estrela" title="Conversar com Façao Estrela">💬</button>
                </div>
                <p><strong>Serviço:</strong> Uniforme</p>
                <button class="btn-ver">Ver detalhes</button>
            </div>

            <div class="card">
                <div class="card-top">
                    <h3>Costura Bella</h3>
                    <button class="btn-chat-card" data-faccao="Costura Bella" title="Conversar com Costura Bella">💬</button>
                </div>
                <p><strong>Serviço:</strong> Jeans</p>
                <button class="btn-ver">Ver detalhes</button>
            </div>

            <div class="card">
                <div class="card-top">
                    <h3>Mãos de Ouro</h3>
                    <button class="btn-chat-card" data-faccao="Mãos de Ouro" title="Conversar com Mãos de Ouro">💬</button>
                </div>
                <p><strong>Serviço:</strong> Social</p>
                <button class="btn-ver">Ver detalhes</button>
            </div>

        </div>
    </div>

    </main>

    <div id="chat-widget" class="chat-widget hidden">

        <div class="chat-header">
            <div class="chat-title">
                <span>💬</span>
                <span id="chat-context-title">Bate-papo</span>
            </div>
            <button id="close-chat" class="chat-close-btn">&times;</button>
        </div>

        <div id="chat-messages" class="chat-body">
        </div>

        <form id="chat-form" class="chat-footer">
            <input type="text" id="chat-input" placeholder="Digite sua mensagem..." autocomplete="off">
            <button type="submit" class="chat-send-btn">➤</button>
        </form>
    </div>

    <footer>
        © 2025 Entre-Linhas — Todos os direitos reservados.
    </footer>

    <script src="frontend/js/main.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entre-Linhas — Faccionista</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./frontend/css/faccionista.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo">
            <img src="frontend/images/agulha.png" class="logo-icon">
            Entre-Linhas
        </div>
        <div class="header-icons">
            <button class="icon-btn">💬</button>
            <button class="icon-btn">👤</button>
        </div>
    </header>

    <!-- CONTEÚDO -->
    <main class="container">

        <h2>Facções</h2>

        <div class="panel">
            <div class="cards-grid">

                <div class="card">
                    <h3>Fação Estrela</h3>
                    <p><strong>Serviço:</strong> Corte e Costura</p>
                    <button class="btn-ver">Ver detalhes</button>
                </div>

                <div class="card">
                    <h3>Costura Bella</h3>
                    <p><strong>Serviço:</strong> Acabamento</p>
                    <button class="btn-ver">Ver detalhes</button>
                </div>

                <div class="card">
                    <h3>Mãos de Ouro</h3>
                    <p><strong>Serviço:</strong> Montagem</p>
                    <button class="btn-ver">Ver detalhes</button>
                </div>

            </div>
        </div>

    </main>

    <!-- RODAPÉ -->
    <footer>
        © 2025 Entre-Linhas — Todos os direitos reservados.
    </footer>

</body>
</html>
